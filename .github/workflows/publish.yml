name: Publish to npm

# Runs on a published GitHub Release — or on a manual dispatch, which is the
# only real path: the Release is created by release.yml with the GITHUB_TOKEN,
# and GitHub suppresses `release` events that token triggers.
#
# Publishing authenticates through OIDC trusted publishing: the npm package
# trusts `wuwaka/dsh-rehearsal`'s `publish.yml` (configured in the package's
# npm Settings → Trusted Publisher), and the job's id-token proves identity.
# No npm secret is involved. The former gate job (skip when NPM_TOKEN absent)
# and the NODE_AUTH_TOKEN env are gone with the secret dependency.
#
# The tarball carries signed provenance either way — with trusted publishing
# the attestation comes from the same OIDC identity that authorized it.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not tag: this workflow publishes to npm, so a
      # retagged action reference must not be able to swap the executed code
      # underneath it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # OIDC authentication on publish needs npm >= 11.5.1; the npm bundled
      # with a given Node 24.x patch is not guaranteed to be that new.
      - run: npm install -g npm@latest

      - run: npm ci

      # Publish exactly what the tests saw, from this commit. No build step
      # exists, so the tarball is the repository content filtered by `files`.
      - run: npm test

      - name: Verify the packed tarball is usable before publishing
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent | tail -1)
          mkdir -p /tmp/pkgtest
          npm install --no-audit --no-fund --prefix /tmp/pkgtest "./$tarball"
          node /tmp/pkgtest/node_modules/dsh-rehearsal/src/cli.js --version
          node /tmp/pkgtest/node_modules/dsh-rehearsal/src/cli.js --help > /dev/null
          echo "packed tarball verified: $tarball"

      - run: npm publish --provenance --access public
