name: Release

# Tag-driven GitHub Release: guard -> test -> smoke-install -> notes -> assets.
#
# Two deliberate refusals, both because a wrong artifact is worse than none:
#   * the tag must equal package.json's version, or the job stops;
#   * both CHANGELOG.zh.md and CHANGELOG.md must carry a section for that version,
#     or the job stops — so a Release can never ship with an empty "just look at
#     the code" note, and the Chinese and English halves cannot drift apart.
#
# The tarball plus its checksum are attached so an install line can be pinned to
# bytes. Publishing to npm happens in publish.yml, on `release: published`.
#
# workflow_dispatch exists so the notes or assets of an already-cut tag can be
# rebuilt without moving a public tag: the job checks the tag out, so package.json
# and CHANGELOG still come from the tagged commit even when this file is newer.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing v* tag to rebuild the release for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        # The tag value reaches the script through the environment, never
        # through ${{ }} interpolation: a tag name is user-controlled input,
        # and a quoted in-place interpolation stays shell-injectable.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in v*) ;; *) echo "::error::$tag is not a v* tag"; exit 1 ;; esac
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          # This job runs with contents: write: the default persisted git
          # credentials are an unneeded standing secret for a job that only
          # packs, tests and uploads release assets via gh.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'

      - name: Guard - tag must match package.json version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "v${pkg}" != "$tag" ]; then
            echo "::error::tag ${tag} does not match package.json version v${pkg}"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Pack and smoke-install the tarball
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').name.split('/').pop()")-$(node -p "require('./package.json').version")"
          npm pack --ignore-scripts > /dev/null
          tarball="${base}.tgz"
          [ -f "$tarball" ] || { echo "::error::expected $tarball after npm pack"; exit 1; }
          prefix="$(mktemp -d)"
          npm install --global --prefix "$prefix" --no-audit --no-fund "./$tarball" > /dev/null
          "$prefix/bin/dsh-rehearsal" --version
          "$prefix/bin/dsh-rehearsal" --help > /dev/null
          sha256sum "$tarball" > "${tarball}.sha256"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "SHAFILE=${tarball}.sha256" >> "$GITHUB_ENV"

      - name: Build release notes from both changelogs
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$TAG" > release-notes.md

      - name: Publish the release with assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md ${pre[@]+"${pre[@]}"}
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md ${pre[@]+"${pre[@]}"}
          fi
          gh release upload "$TAG" "$TARBALL" "$SHAFILE" --clobber
          # isPrerelease, not prerelease: gh's release JSON gained that field name
          # and the wrong one fails the run after the release is already published.
          gh release view "$TAG" --json tagName,isPrerelease,isDraft,assets \
            --jq '.tagName + " draft=" + (.isDraft|tostring) + " prerelease=" + (.isPrerelease|tostring) + " assets=" + ([.assets[].name]|join(","))'
