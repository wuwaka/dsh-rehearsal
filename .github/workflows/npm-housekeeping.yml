name: npm housekeeping

# One-off npm management runner. This iteration is diagnostic: prove the CLI's
# own write path still works with NPM_TOKEN (idempotent deprecate re-set), then
# issue a raw DELETE for the stray dist-tag and dump every response header, so
# the 403 either shows an OTP challenge or is proven a hard permission wall.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: dist-tag to probe DELETE for
        required: true
        type: string
        default: tmp-write-verify

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Probe DELETE dist-tag with full response headers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          npm deprecate dsh-rehearsal@0.2.0 "superseded by 0.2.1 — predates the redaction fixes" --registry https://registry.npmjs.org
          echo "--- deprecate re-set ok, CLI write path confirmed ---"
          node -e '
            (async () => {
              const token = process.env.NODE_AUTH_TOKEN;
              const tag = process.env.TAG;
              const ua = "npm/11.19.0 node/" + process.version + " linux x64 workspaces/false";
              const res = await fetch("https://registry.npmjs.org/-/package/dsh-rehearsal/dist-tags/" + tag, {
                method: "DELETE",
                headers: {
                  "user-agent": ua,
                  Authorization: "Bearer " + token,
                  "npm-session": "3710000000000000",
                  "npm-command": "dist-tag",
                  "npm-auth-type": "web",
                },
              });
              console.log("DELETE status:", res.status);
              for (const [k, v] of res.headers) console.log("  header:", k + "=", JSON.stringify(v));
              console.log("body:", JSON.stringify((await res.text()).slice(0, 400)));
            })().catch((e) => { console.error(e); process.exit(1); });
          '
