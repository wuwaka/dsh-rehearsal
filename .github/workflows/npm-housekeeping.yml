name: npm housekeeping

# One-off npm management runner for operations neither the owner's granular
# token nor this repo's NPM_TOKEN can do directly (registry answers 403 to
# DELETE dist-tags). Walks npm deprecate's own path: GET ?write=true, then PUT
# the doc back — first unchanged (shape check), then with the tag dropped.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: dist-tag to remove from dsh-rehearsal
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove dist-tag via packument PUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node -e '(async () => {
            const token = process.env.NODE_AUTH_TOKEN;
            const tag = process.env.TAG;
            const pkg = "dsh-rehearsal";
            const ua = "npm-registry-fetch@19.1.1/node@" + process.version + "+" + process.arch + " (" + process.platform + ")";
            if (!token) throw new Error("NODE_AUTH_TOKEN missing");
            const authHeaders = { Accept: "application/json", "user-agent": ua, Authorization: "Bearer " + token };
            const get = await fetch("https://registry.npmjs.org/" + pkg + "?write=true", { headers: authHeaders });
            if (!get.ok) throw new Error("GET failed: " + get.status);
            const doc = await get.json();
            console.log("has _rev:", "_rev" in doc, "| dist-tags:", JSON.stringify(doc["dist-tags"]));
            const putHeaders = { "Content-Type": "application/json", "user-agent": ua, "npm-session": "3710000000000000", "npm-command": "deprecate", Authorization: "Bearer " + token };
            const doPut = async (label, d) => {
              const put = await fetch("https://registry.npmjs.org/" + pkg, { method: "PUT", headers: putHeaders, body: JSON.stringify(d) });
              const text = await put.text();
              console.log(label, "PUT status:", put.status, text.slice(0, 200));
              return put.ok;
            };
            const shapeOk = await doPut("unchanged:", doc);
            if (!shapeOk) { console.log("unchanged PUT failed => request-shape problem, stopping"); process.exit(1); }
            if (!(tag in (doc["dist-tags"] || {}))) { console.log("tag already absent:", tag); process.exit(0); }
            delete doc["dist-tags"][tag];
            const mutatedOk = await doPut("mutated :", doc);
            if (!mutatedOk) { console.log("unchanged PUT ok but mutated PUT failed => registry refuses dist-tag removal via packument PUT"); process.exit(1); }
            console.log("removed dist-tag:", tag);
          })().catch((e) => { console.error(e); process.exit(1); });'
