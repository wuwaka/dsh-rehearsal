name: npm housekeeping

# One-off npm management runner. Packument PUTs accept additive changes but
# answer 422 to no-ops and to dist-tag removal, and DELETE dist-tags is 403 for
# both available tokens. Last untried channel: the legacy dist-tags-map PUT
# (npm 6's own endpoint), which replaces the whole tag table in one write. If
# that also fails, dump the DELETE's full response headers for the record.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: dist-tag to remove from dsh-rehearsal
        required: true
        type: string
        default: tmp-write-verify

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Replace dist-tags map without the stray tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node -e '
            (async () => {
              const token = process.env.NODE_AUTH_TOKEN;
              const tag = process.env.TAG;
              const ua = "npm/11.19.0 node/" + process.version + " linux x64 workspaces/false";
              const headers = {
                "Content-Type": "application/json",
                "user-agent": ua,
                Authorization: "Bearer " + token,
                "npm-session": "3710000000000000",
                "npm-command": "dist-tag",
                "npm-auth-type": "web",
              };
              const current = await (await fetch("https://registry.npmjs.org/dsh-rehearsal", { headers: { Accept: "application/json" } })).json();
              const map = { ...current["dist-tags"] };
              if (!(tag in map)) { console.log("tag already absent:", tag); process.exit(0); }
              delete map[tag];
              const put = await fetch("https://registry.npmjs.org/-/package/dsh-rehearsal/dist-tags", {
                method: "PUT", headers, body: JSON.stringify(map),
              });
              console.log("dist-tags map PUT status:", put.status, JSON.stringify((await put.text()).slice(0, 300)));
              if (put.ok) { console.log("removed dist-tag:", tag); process.exit(0); }
              const del = await fetch("https://registry.npmjs.org/-/package/dsh-rehearsal/dist-tags/" + tag, { method: "DELETE", headers });
              console.log("DELETE status:", del.status);
              for (const [k, v] of del.headers) console.log("  header:", k + "=", JSON.stringify(v));
              console.log("DELETE body:", JSON.stringify((await del.text()).slice(0, 400)));
              process.exit(1);
            })().catch((e) => { console.error(e); process.exit(1); });
          '
