name: npm housekeeping

# One-off npm management runner for operations neither the owner's granular
# token nor this repo's NPM_TOKEN can do directly (the registry answers 403 to
# DELETE dist-tags from both). Uses npm's own npm-registry-fetch from the
# runner's global install to walk npm deprecate's exact path: GET ?write=true,
# mutate dist-tags, PUT the doc back.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: dist-tag to remove from dsh-rehearsal
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Remove dist-tag via npm-registry-fetch
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export NPMROOT="$(npm root -g)"
          node -e '
            const npmFetch = require(process.env.NPMROOT + "/npm/node_modules/npm-registry-fetch");
            const tag = process.env.TAG;
            const opts = {
              registry: "https://registry.npmjs.org/",
              token: process.env.NODE_AUTH_TOKEN,
              userAgent: "npm/11.19.0 node/" + process.version + " linux x64 workspaces/false",
              npmSession: "3710000000000000",
              npmCommand: "deprecate",
            };
            (async () => {
              const doc = await npmFetch.json("/dsh-rehearsal", { ...opts, query: { write: true } });
              if (!(tag in (doc["dist-tags"] || {}))) { console.log("tag already absent:", tag); return; }
              delete doc["dist-tags"][tag];
              await npmFetch("/dsh-rehearsal", { ...opts, method: "PUT", body: doc, ignoreBody: true });
              console.log("removed dist-tag:", tag);
            })().catch((e) => { console.error(e && (e.code + " " + e.message) || e); process.exit(1); });
          '
